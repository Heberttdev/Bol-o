<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolão Green — Sem conexão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0b0f14;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #FFD700;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .wifi-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #141a23;
      border: 2px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.15); }
      50% { box-shadow: 0 0 0 16px rgba(255,215,0,0); }
    }

    .title { font-size: 1.3rem; font-weight: 700; }

    .subtitle {
      font-size: 0.9rem;
      color: #aab;
      line-height: 1.6;
      margin-top: 8px;
    }

    .tips {
      background: #141a23;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tip {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .tip-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #0F3D2E;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tip span { font-size: 0.82rem; color: #ccc; }

    .btn-retry {
      width: 100%;
      padding: 13px;
      background: #FFD700;
      color: #0F3D2E;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-retry:hover { opacity: 0.9; }
    .btn-retry:active { opacity: 0.75; }

    .footer { font-size: 0.75rem; color: #444; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Logo -->
    <div class="logo">
      <!-- CircleDot (Lucide) -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="1"/>
      </svg>
      Bolão Green
    </div>

    <!-- Ícone WifiOff (Lucide) -->
    <div class="wifi-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <!-- Texto -->
    <div>
      <p class="title">Sem conexão</p>
      <p class="subtitle">
        O Bolão Green precisa de internet pra carregar os jogos e palpites em tempo real.
      </p>
    </div>

    <!-- Dicas com ícones SVG (Lucide: Wifi, PlaneTakeoff, RotateCcw) -->
    <div class="tips">

      <div class="tip">
        <div class="tip-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </div>
        <span>Verifique se o Wi-Fi ou dados móveis estão ativos</span>
      </div>

      <div class="tip">
        <div class="tip-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19 2c-2-2-4-2-5.5-.5L10 5 1.8 6.2a.5.5 0 0 0-.3.8L4 9.5l-1 2.5 2.5 2.5L8 13.5l2.5 2.5-1.5 1.5.8 2.1a.5.5 0 0 0 .8.3z"/>
          </svg>
        </div>
        <span>Certifique-se que o modo avião está desligado</span>
      </div>

      <div class="tip">
        <div class="tip-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v6h6"/>
            <path d="M3 8C5.5 4.5 9.5 2 14 2a10 10 0 0 1 0 20c-4.5 0-8.5-2.5-11-6"/>
          </svg>
        </div>
        <span>A tela atualiza automaticamente quando a conexão voltar</span>
      </div>

    </div>

    <!-- Botão com ícone RefreshCw (Lucide) -->
    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F3D2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Tentar novamente
    </button>

    <p class="footer">Bolão Green © 2026</p>
  </div>

  <script>
  var URL_APP = "https://bolao26-bbe2c.web.app/";

  function tentarNovamente() {
    window.location.href = URL_APP;
  }

  // Volta sozinho quando a internet retornar
  window.addEventListener("online", tentarNovamente);
  setInterval(function () {
    if (navigator.onLine) tentarNovamente();
  }, 5000);
</script>
</body>
</html>
