<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolão Chamar o Green — Sem conexão</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at top, #0f172a, #05070d);
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: #141a23;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    border: 1px solid rgba(0, 255, 136, 0.2);
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
    animation: entrar .5s ease;
  }
  @keyframes entrar {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .icon-wrap {
    width: 84px; height: 84px; margin: 0 auto 18px;
    border-radius: 50%;
    background: rgba(255, 77, 77, 0.12);
    border: 1px solid rgba(255, 77, 77, 0.35);
    display: flex; align-items: center; justify-content: center;
  }
  h1 {
    font-size: 1.25rem; margin-bottom: 6px;
    display: flex; gap: 8px; justify-content: center; align-items: center;
  }
  .trophy { color: #ffd700; }
  p.sub { color: #aaa; font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #00ff88; color: #000;
    font-weight: 700; font-size: 1rem; cursor: pointer;
    transition: all .2s;
  }
  .btn:active { transform: scale(.98); background: #00cc6a; }
  .status {
    margin-top: 16px; font-size: .78rem; color: #666;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff3b3b; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Ícone wifi-off (lucide) -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1><span class="trophy">🏆</span> Bolão Chamar o Green</h1>
    <p class="sub">
      Você está <strong>sem conexão</strong> com a internet.<br />
      Assim que a conexão voltar, seus palpites continuam te esperando.
    </p>
    <button class="btn" onclick="tentarNovamente()">Tentar novamente</button>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">verificando conexão…</span>
    </div>
  </div>

<script>
  var URL_APP = "https://bolao26-bbe2c.web.app/";

  function tentarNovamente() {
    window.location.href = URL_APP;
  }

  // Volta sozinho quando a internet retornar
  window.addEventListener("online", tentarNovamente);
  setInterval(function () {
    if (navigator.onLine) tentarNovamente();
  }, 5000);
</script>
</body>
</html>
